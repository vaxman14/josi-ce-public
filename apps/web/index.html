<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0 on an iPhone; the Talk composer sits on that inset. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/brand/josi-mark.png" />
    <!-- iOS ignores the manifest's icons and reads this one. 192px rather than
         the 1024px master, so a home-screen install does not pull a 3 MB PNG
         over a phone connection. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches the manifest's background_color, so the status bar and the
         splash screen do not flash white on a dark app. -->
    <meta name="theme-color" content="#0b111e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Josi" />
    <title>Josi</title>
    <!-- NO external stylesheet, font or script. The commercial engine loads
         Fira Sans from fonts.googleapis.com on every page; a self-hosted
         product doing that would tell Google the IP address of every person who
         opens it, break entirely on an air-gapped install, and make the
         Local-only badge a claim the page itself contradicts. CE uses the
         system font stack: nothing to download, and it looks native on the
         low-power hardware CE targets. Enforced by CSP, not just by intent. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
