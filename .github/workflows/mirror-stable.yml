name: mirror stable aliases

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published numbered version whose OCI indexes become latest (for example 0.1.26).'
        required: true

permissions:
  contents: read

jobs:
  mirror-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy application OCI index to Docker Hub latest
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/josi-ce:latest" \
            "ghcr.io/${{ github.repository_owner }}/josi-ce:${{ inputs.version }}"
      - name: Copy installer OCI index to Docker Hub latest
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/josi-ce-installer:latest" \
            "ghcr.io/${{ github.repository_owner }}/josi-ce-installer:${{ inputs.version }}"
