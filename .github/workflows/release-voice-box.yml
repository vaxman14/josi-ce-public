name: release-voice-box

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Voice Box image tag
        required: true
        default: 0.1.0

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Validate audited Voice Box inputs
        run: |
          python3 -m unittest discover -s services/voice-box -p 'test_*.py'
          bash scripts/scan-secrets.sh
      - name: Build and publish reviewed CPU image
        uses: docker/build-push-action@v6
        with:
          context: services/voice-box
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vaxman14/josi-voice-box:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          provenance: true
          sbom: true
      - name: Report immutable index digest
        run: docker buildx imagetools inspect ghcr.io/vaxman14/josi-voice-box:${{ inputs.tag }}
