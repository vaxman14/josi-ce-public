name: mirror stable latest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GHCR version to promote to Docker Hub latest
        required: true

permissions:
  contents: read

jobs:
  mirror-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote exact application OCI index
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/josi-ce:latest" \
            "ghcr.io/${{ github.repository_owner }}/josi-ce:${{ inputs.tag }}"
      - name: Promote exact installer OCI index
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/josi-ce-installer:latest" \
            "ghcr.io/${{ github.repository_owner }}/josi-ce-installer:${{ inputs.tag }}"
