name: Bug report
description: Report a reproducible problem in Josi CE
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, personal data, private hostnames, and user content before submitting. Report vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Josi CE version or image digest
      placeholder: 0.1.0 or sha256:…
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - linux/amd64
        - linux/arm64
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Never include secrets or user content.
      render: shell
